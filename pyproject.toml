[project]
name = "sft-safety"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "impossiblebench",
    "inspect-ai>=0.3.252",
    "inspect-evals>=0.16.0",
    "inspect-petri>=3.0.11",
    "openai>=2.53.0",
    "vllm>=0.26.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = []

[tool.uv.sources]
impossiblebench = { path = "impossiblebench", editable = true }
